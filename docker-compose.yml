version: '3'

services:
  deep-research:
    container_name: deep-research
    build: .
    env_file:
      - .env.local
    volumes:
      - ./:/app/
    tty: true
    stdin_open: true
    depends_on:
      - crawl4ai

  crawl4ai:
    container_name: crawl4ai-service
    build: ./crawl4ai-service
    ports:
      - "8001:8000"
    volumes:
      - ./crawl4ai-service/cache:/app/cache
    environment:
      - ENVIRONMENT=production
      - CACHE_MODE=USE_CACHE
    restart: unless-stopped
